version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kasupport-db
    environment:
      POSTGRES_USER: kasupport
      POSTGRES_PASSWORD: kasupport_secure_password
      POSTGRES_DB: kasupport
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasupport -d kasupport"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kasupport-backend
    environment:
      PORT: 4100
      DATABASE_URL: postgres://kasupport:kasupport_secure_password@postgres:5432/kasupport
      JWT_SECRET: cambia_este_secret_por_uno_seguro
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
